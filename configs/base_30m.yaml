# Default 30M run. All values in YAML per spec; CLI can override top-level keys.
project: minigpt-stack
run_name: base_30m

seed: 1337

model:
  vocab_size: 8192
  n_layers: 8
  d_model: 512
  n_heads: 8
  ffn_hidden: 1536
  context_len: 512
  norm: rmsnorm        # alternating choice would go here; default rmsnorm
  pos: rope            # rotary position embeddings
  mlp: swiglu          # or gelu
  weight_tying: true
  dropout: 0.0

tokenizer:
  vocab_size: 8192
  special_tokens: ["<|endoftext|>", "<|pad|>"]

train:
  batch_tokens: 65536        # logical batch in tokens; grad_accum derives from this
  micro_batch_seqs: 8        # sequences per micro-batch (tune to fit T4 16GB)
  context_len: 512
  max_steps: 18000           # PROVISIONAL: ~1.18B tokens @65k/step; reset after calibration measures tok/s
  lr: 6.0e-4
  min_lr_ratio: 0.1
  warmup_steps: 500         # was 2000 (~1/5 of run); lowered post-calibration per decision
  weight_decay: 0.1
  grad_clip: 1.0
  use_fp16: true             # T4 handles bf16 poorly -> fp16 + GradScaler
  use_scaler: true
  log_every: 50
  val_every: 1000
  val_windows: 200           # fixed windows reused every eval (comparable val loss)
  sample_every: 2000
  tokens_per_sample: 256

checkpoint:
  dir: checkpoints/base_30m
  save_every: 1000           # steps; Kaggle sessions die ~9h so keep this <= 1h of train
  save_every_min: 20         # wall-clock backstop: checkpoint even mid-interval
  max_hours: 8               # clean save+exit before Kaggle kills the session
  keep_last_n: 5
  # resume: latest checkpoint in dir; must restore model, optimizer, scaler,
  # scheduler, RNG state, and data position (Phase 3 acceptance test).

data:
  name: TinyStories
  out_dir: data
  tokenizer_path: tokenizer/tok8192.json
  train_bins: data/tinystories_train_*.bin
  val_bins: data/tinystories_val.bin

logging:
  use_wandb: false
  project: minigpt-stack
